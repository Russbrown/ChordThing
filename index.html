<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Files — Piano Chord Progression Tool</title>
<meta name="description" content="Explore, audition and practise piano chord progressions. Diatonic, modal interchange and secondary dominant chords with voiced keyboard diagrams and Rhodes-style audio playback.">
<meta name="theme-color" content="#111010">

<!-- Open Graph -->
<meta property="og:title" content="Chord Files">
<meta property="og:description" content="Build and practise piano chord progressions with voiced keyboard diagrams and Rhodes-style audio.">
<meta property="og:type" content="website">

<!-- Favicon: simple amber square -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23111010'/><text x='50%25' y='54%25' font-family='serif' font-size='20' fill='%23c8a96e' text-anchor='middle' dominant-baseline='middle'>♩</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111010;
    --surface: #1a1918;
    --card: #201f1d;
    --border: #333;
    --accent: #c8a96e;
    --accent2: #7a9e87;
    --text: #e8e4de;
    --muted: #6b6560;
    --dim: #3a3835;
    --root-dot: #ffffff;
    --chord-dot: #1a1918;
    --scale-dot: #c8a96e;
    --key-white: #d8d4cc;
    --key-black: #1f1e1c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--accent);
  }


  /* ── CONTROLS ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--dim);
    background: var(--surface);
    flex-wrap: wrap;
  }

  .control-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .key-selector {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .key-btn {
    background: var(--card);
    border: 1px solid var(--dim);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 6px 11px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 3px;
  }

  .key-btn:hover { border-color: var(--accent); color: var(--text); }

  .key-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #111;
    font-weight: 700;
  }

  .mode-toggle {
    margin-left: auto;
    display: flex;
    gap: 2px;
    background: var(--bg);
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 3px;
  }

  .mode-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 5px 12px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }

  .mode-btn.active {
    background: var(--card);
    color: var(--text);
  }

  /* ── MAIN GRID ── */
  .main {
    flex: 1;
    padding: 12px 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }

  /* ── SECTION HEADER ── */
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 6px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--accent);
  }

  .section-sub {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  /* ── CHORD ROW ── */
  .chord-row {
    display: grid;
    grid-template-columns: 70px repeat(7, 1fr);
    gap: 8px;
    align-items: start;
  }

  .row-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: right;
    padding-top: 14px;
    padding-right: 8px;
    letter-spacing: 1px;
  }

  /* ── CHORD CARD ── */
  .chord-card {
    background: var(--card);
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 10px 8px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    min-width: 0;
  }

  .chord-card:hover {
    border-color: var(--accent);
    background: #252320;
  }

  .chord-card.active {
    border-color: var(--accent);
    background: #252320;
    box-shadow: 0 0 0 1px var(--accent)33;
  }

  .chord-card.borrowed {
    border-color: #4a5a52;
  }

  .chord-card.borrowed:hover, .chord-card.borrowed.active {
    border-color: var(--accent2);
    box-shadow: 0 0 0 1px var(--accent2)33;
  }

  .chord-numeral {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .chord-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 1px;
    color: var(--text);
    line-height: 1;
    margin-bottom: 2px;
  }

  .chord-quality {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
  }

  .chord-card.borrowed .chord-numeral { color: var(--accent2); }
  .chord-card.borrowed .chord-name { color: #9dbba8; }

  /* secondary dominant badge */
  .sec-dom-badge {
    position: absolute;
    top: 5px; right: 5px;
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    color: #d4883a;
    background: #2a1f12;
    border: 1px solid #4a3020;
    border-radius: 2px;
    padding: 1px 3px;
    letter-spacing: 0;
  }

  /* ── KEYBOARD DIAGRAM ── */
  .keyboard-wrap {
    margin-top: 6px;
  }

  .keyboard {
    position: relative;
    height: 52px;
    width: 100%;
  }

  .white-key {
    position: absolute;
    bottom: 0;
    height: 52px;
    background: var(--key-white);
    border: 1px solid #444;
    border-radius: 0 0 3px 3px;
  }

  .black-key {
    position: absolute;
    bottom: 20px;
    height: 32px;
    background: var(--key-black);
    border: 1px solid #555;
    border-radius: 0 0 2px 2px;
    z-index: 2;
  }

  .key-dot {
    position: absolute;
    border-radius: 50%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
  }

  .key-dot.root { background: var(--root-dot); width: 9px; height: 9px; bottom: 4px; border: 1.5px solid #888; }
  .key-dot.chord-tone { background: var(--chord-dot); width: 8px; height: 8px; bottom: 5px; border: 1.5px solid #aaa; }
  .key-dot.scale-tone { background: var(--scale-dot); width: 7px; height: 7px; bottom: 5px; }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    background: var(--card);
    border: 1px solid var(--dim);
    border-radius: 6px;
    padding: 20px 24px;
    display: none;
  }

  .detail-panel.visible { display: block; }

  .detail-inner {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
  }

  .detail-col {}

  .detail-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .detail-chord-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }

  .detail-notes {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .detail-function {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  .detail-keyboard {
    margin-top: 0;
  }

  .detail-keyboard .keyboard {
    height: 100px;
  }

  .detail-keyboard .white-key {
    height: 100px;
  }

  .detail-keyboard .black-key {
    height: 62px;
    bottom: 36px;
  }

  .detail-keyboard .key-dot.root { width: 20px; height: 20px; bottom: 10px; }
  .detail-keyboard .key-dot.chord-tone { width: 20px; height: 20px; bottom: 10px; }
  .detail-keyboard .key-dot.scale-tone { width: 12px; height: 12px; bottom: 10px; }

  .close-btn {
    float: right;
    background: none;
    border: 1px solid var(--dim);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 2px;
    margin-top: -4px;
  }

  .close-btn:hover { color: var(--text); border-color: var(--border); }

  /* ── PROGRESSION BUILDER ── */
  .prog-bar {
    background: var(--surface);
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 14px 18px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .prog-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    flex-shrink: 0;
    padding-top: 10px;
  }

  .prog-slots {
    display: flex;
    gap: 8px;
    flex: 1;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .prog-slot-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .prog-slot {
    background: var(--bg);
    border: 1px dashed var(--dim);
    border-radius: 3px;
    padding: 6px 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 1px;
    min-width: 58px;
    text-align: center;
    cursor: default;
    transition: all 0.15s;
    position: relative;
    user-select: none;
  }

  .prog-slot.filled {
    border-color: var(--accent);
    color: var(--text);
    cursor: pointer;
    border-style: solid;
  }

  .prog-slot.filled:hover { background: #252320; }

  .prog-slot .slot-remove {
    position: absolute;
    top: 2px; right: 3px;
    font-size: 9px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    pointer-events: none;
  }

  .prog-slot.filled:hover .slot-remove {
    opacity: 1;
    pointer-events: all;
  }

  .prog-slot .slot-remove:hover { color: #c06060; }

  /* Per-slot voicing strip — always in DOM, hidden until filled */
  .slot-voicing {
    display: flex;
    gap: 2px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }

  .prog-slot-wrap.filled .slot-voicing {
    opacity: 1;
    pointer-events: all;
  }

  .slot-v-btn {
    background: var(--bg);
    border: 1px solid var(--dim);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    padding: 3px 5px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.12s;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .slot-v-btn:hover { border-color: var(--accent); color: var(--text); }
  .slot-v-btn.active { background: var(--dim); border-color: var(--accent); color: var(--accent); }

  /* ── PROG ACTIONS ── */
  .prog-actions {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    padding-top: 2px;
    flex-shrink: 0;
  }

  .action-btn {
    background: var(--bg);
    border: 1px solid var(--dim);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 7px 12px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .action-btn:hover { border-color: var(--accent); color: var(--text); }

  .action-btn.primary {
    border-color: var(--accent);
    color: var(--accent);
  }

  .action-btn.primary:hover {
    background: var(--accent);
    color: #111;
  }

  /* ── SAVED PROGRESSIONS ── */
  .saved-section {
    margin-top: 4px;
  }

  .saved-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .saved-item {
    background: var(--surface);
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .saved-item:hover { border-color: var(--accent); }

  .saved-name {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    min-width: 80px;
  }

  .saved-chords {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 1px;
    flex: 1;
  }

  .saved-key {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .saved-del {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 5px;
    border-radius: 2px;
    transition: color 0.12s;
  }

  .saved-del:hover { color: #c06060; }

  /* ── SCALE BAR ── */
  .scale-bar {
    background: var(--surface);
    border: 1px solid var(--dim);
    border-radius: 4px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .scale-notes {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .scale-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    background: var(--card);
    border: 1px solid var(--dim);
    border-radius: 2px;
    padding: 3px 7px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .scale-note.root-note {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ── EMPTY STATE ── */
  .empty-saved {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding: 20px;
    letter-spacing: 1px;
  }

  /* ── VOICING PANEL ── */
  .voicing-strip {
    display: flex;
    gap: 4px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .v-btn {
    background: var(--bg);
    border: 1px solid var(--dim);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    padding: 3px 7px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.12s;
    letter-spacing: 0.5px;
  }

  .v-btn:hover { border-color: var(--accent); color: var(--text); }
  .v-btn.active { background: var(--dim); border-color: var(--accent); color: var(--accent); }

  /* ── PLAYBACK STATUS ── */
  .play-status {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    padding-top: 8px;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .play-status.playing {
    color: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }

</style>
</head>
<body>

<header>
  <div class="logo">Chord Files</div>
</header>

<!-- Key / Mode controls -->
<div class="controls">
  <span class="control-label">Key</span>
  <div class="key-selector" id="keySelector"></div>
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn active" data-mode="major">MAJOR</button>
    <button class="mode-btn" data-mode="minor">MINOR</button>
  </div>
</div>

<div class="main">

  <!-- Scale bar -->
  <div class="scale-bar" id="scaleBar"></div>

  <!-- Chord grid -->
  <div id="chordGrid"></div>

  <!-- Detail panel -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-inner" id="detailInner"></div>
  </div>

  <!-- Progression builder -->
  <div class="prog-bar">
    <span class="prog-label">PROGRESSION</span>
    <div class="prog-slots" id="progSlots"></div>
    <div class="prog-actions">
      <span class="play-status" id="playStatus"></span>
      <button class="action-btn primary" id="playBtn" onclick="playProgression()">▶ PLAY</button>
      <button class="action-btn" onclick="exportMIDI()">↓ MIDI</button>
      <button class="action-btn" onclick="saveProgression()">SAVE</button>
      <button class="action-btn" onclick="clearProgression()">CLEAR</button>
    </div>
  </div>

  <!-- Saved progressions -->
  <div class="saved-section">
    <div class="section-head">
      <span class="section-title">Saved</span>
    </div>
    <div class="saved-list" id="savedList"></div>
  </div>

</div>

<script>
// ── THEORY DATA ──
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_NAMES = {
  'C#':'C#/Db','D#':'D#/Eb','F#':'F#/Gb','G#':'G#/Ab','A#':'A#/Bb'
};

const MAJOR_INTERVALS = [0,2,4,5,7,9,11];
const MINOR_INTERVALS = [0,2,3,5,7,8,10];

const MAJOR_QUALITIES = ['maj','min','min','maj','dom7','min','dim'];
const MINOR_QUALITIES = ['min','dim','maj','min','min','maj','dom7'];

const MAJOR_NUMERALS = ['I','ii','iii','IV','V','vi','vii°'];
const MINOR_NUMERALS = ['i','ii°','III','iv','v','VI','VII'];

const CHORD_INTERVALS = {
  maj:  [0,4,7],
  min:  [0,3,7],
  dim:  [0,3,6],
  dom7: [0,4,7,10],
  maj7: [0,4,7,11],
  min7: [0,3,7,10],
  sus2: [0,2,7],
  sus4: [0,5,7],
  add9: [0,4,7,14],
};

// Borrowed chords per mode (scale degree → {quality, label})
const BORROWED = {
  major: [
    { degree: 0, quality: 'min',  label: 'i',    name: 'min', source: 'Dorian/Phrygian' },
    { degree: 1, quality: 'min',  label: 'ii',   name: 'min', source: 'Lydian' },
    { degree: 2, quality: 'maj',  label: 'bIII', name: 'maj', source: 'Mixolydian' },
    { degree: 3, quality: 'min',  label: 'iv',   name: 'min', source: 'Dorian' },
    { degree: 4, quality: 'min',  label: 'v',    name: 'min', source: 'Aeolian' },
    { degree: 5, quality: 'maj',  label: 'bVI',  name: 'maj', source: 'Aeolian' },
    { degree: 6, quality: 'maj',  label: 'bVII', name: 'maj', source: 'Mixolydian' },
  ],
  minor: [
    { degree: 0, quality: 'maj',  label: 'I',    name: 'maj', source: 'Major' },
    { degree: 1, quality: 'min',  label: 'ii',   name: 'min', source: 'Dorian' },
    { degree: 2, quality: 'min',  label: 'iii',  name: 'min', source: 'Major' },
    { degree: 3, quality: 'maj',  label: 'IV',   name: 'maj', source: 'Major/Dorian' },
    { degree: 4, quality: 'dom7', label: 'V7',   name: 'dom7',source: 'Harmonic minor' },
    { degree: 5, quality: 'min',  label: 'vi',   name: 'min', source: 'Major' },
    { degree: 6, quality: 'dim',  label: 'vii°', name: 'dim', source: 'Major' },
  ],
};

// Secondary dominants: V7/x for each diatonic degree
function getSecondaryDominants(rootIdx, mode) {
  const intervals = mode === 'major' ? MAJOR_INTERVALS : MINOR_INTERVALS;
  const result = [];
  intervals.forEach((interval, deg) => {
    const targetRoot = (rootIdx + interval) % 12;
    const secDomRoot = (targetRoot + 7) % 12; // perfect 5th above target
    result.push({
      root: secDomRoot,
      quality: 'dom7',
      label: `V7/${MAJOR_NUMERALS[deg]}`,
      targetDeg: deg,
    });
  });
  return result;
}

// ── STATE ──
let currentKey = 'C';
let currentMode = 'major';
let progression = []; // array of {root, quality, name, voicing}
let savedProgressions = JSON.parse(localStorage.getItem('chord-progressions') || '[]');
let activeDetailCard = null;
let isPlaying = false;
let audioCtx = null;

// ── AUDIO ──
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Rhodes-style electric piano tone
function playNote(freq, startTime, duration, ctx, velocity = 0.7) {
  const gainNode = ctx.createGain();
  gainNode.connect(ctx.destination);

  // Tine oscillator
  const osc1 = ctx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(freq, startTime);
  osc1.connect(gainNode);

  // Harmonic layer for bell-like quality
  const osc2 = ctx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(freq * 2.756, startTime);
  const gain2 = ctx.createGain();
  gain2.gain.setValueAtTime(0.12 * velocity, startTime);
  osc2.connect(gain2);
  gain2.connect(gainNode);

  // Envelope: fast attack, slow decay
  gainNode.gain.setValueAtTime(0, startTime);
  gainNode.gain.linearRampToValueAtTime(0.3 * velocity, startTime + 0.008);
  gainNode.gain.exponentialRampToValueAtTime(0.1 * velocity, startTime + 0.3);
  gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

  osc1.start(startTime);
  osc1.stop(startTime + duration + 0.1);
  osc2.start(startTime);
  osc2.stop(startTime + duration + 0.1);
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// Get voiced MIDI notes for a chord
function getVoicedMidi(rootMidi, quality, voicing = 'close') {
  const intervals = CHORD_INTERVALS[quality] || [0,4,7];
  let notes = intervals.map(i => rootMidi + i);

  if (voicing === 'open') {
    // Spread: raise 3rd by octave if 4 notes, else alternate
    if (notes.length >= 3) notes[1] += 12;
    if (notes.length >= 4) notes[2] -= 12;
  } else if (voicing === 'drop2' && notes.length >= 4) {
    notes[notes.length - 2] -= 12;
  } else if (voicing === 'inv1') {
    // First inversion: move root up an octave
    notes[0] += 12;
    notes.sort((a,b) => a - b);
  } else if (voicing === 'inv2' && notes.length >= 3) {
    notes[0] += 12; notes[1] += 12;
    notes.sort((a,b) => a - b);
  }

  return notes;
}

function playChord(rootMidi, quality, voicing, startTime, duration, ctx) {
  const notes = getVoicedMidi(rootMidi, quality, voicing);
  notes.forEach((midi, i) => {
    const velocity = i === 0 ? 0.5 : (i === notes.length - 1 ? 0.8 : 0.6);
    playNote(midiToFreq(midi), startTime + i * 0.012, duration, ctx, velocity);
  });
}

function playProgression() {
  if (isPlaying) return;
  if (!progression.length) return;
  const ctx = getAudioCtx();
  isPlaying = true;
  document.getElementById('playStatus').textContent = '● PLAYING';
  document.getElementById('playStatus').classList.add('playing');
  document.getElementById('playBtn').textContent = '■ STOP';
  document.getElementById('playBtn').onclick = stopPlayback;

  const chordDuration = 2.0;
  const now = ctx.currentTime + 0.05;

  progression.forEach((ch, i) => {
    const rootNote = NOTES.indexOf(ch.root);
    const rootMidi = 48 + rootNote; // C3 base
    playChord(rootMidi, ch.quality, ch.voicing || 'close', now + i * chordDuration, chordDuration * 0.95, ctx);
  });

  const totalTime = progression.length * chordDuration * 1000;
  setTimeout(() => {
    if (isPlaying) stopPlayback();
  }, totalTime + 500);
}

function stopPlayback() {
  isPlaying = false;
  document.getElementById('playStatus').textContent = '';
  document.getElementById('playStatus').classList.remove('playing');
  document.getElementById('playBtn').textContent = '▶ PLAY';
  document.getElementById('playBtn').onclick = playProgression;
}

// ── MIDI EXPORT ──
function writeMidi(progression) {
  // Build a minimal Type-0 MIDI file with one track
  const TICKS_PER_BEAT = 480;
  const BPM = 90;
  const MICRO_PER_BEAT = Math.round(60000000 / BPM);
  const CHORD_TICKS = TICKS_PER_BEAT * 4; // 4 beats per chord
  const VELOCITY = 80;
  const CHANNEL = 0; // channel 1

  const trackEvents = [];

  // Tempo event
  trackEvents.push([0, 0xff, 0x51, 0x03,
    (MICRO_PER_BEAT >> 16) & 0xff,
    (MICRO_PER_BEAT >> 8) & 0xff,
    MICRO_PER_BEAT & 0xff]);

  let tick = 0;
  progression.forEach(ch => {
    const rootNote = NOTES.indexOf(ch.root);
    const rootMidi = 60 + rootNote; // C4 base
    const midiNotes = getVoicedMidi(rootMidi, ch.quality, ch.voicing || 'close');

    // Note-on events (delta 0 from each other)
    midiNotes.forEach((note, i) => {
      trackEvents.push([i === 0 ? tick : 0, 0x90 | CHANNEL, note, VELOCITY]);
    });

    // Note-off events after CHORD_TICKS
    midiNotes.forEach((note, i) => {
      trackEvents.push([i === 0 ? CHORD_TICKS : 0, 0x80 | CHANNEL, note, 0]);
    });

    tick = 0; // subsequent chords: delta from previous note-off
  });

  // End of track
  trackEvents.push([0, 0xff, 0x2f, 0x00]);

  // Encode variable-length quantity
  function varLen(value) {
    if (value < 0x80) return [value];
    const bytes = [];
    bytes.unshift(value & 0x7f);
    value >>= 7;
    while (value > 0) {
      bytes.unshift((value & 0x7f) | 0x80);
      value >>= 7;
    }
    return bytes;
  }

  // Serialise events
  const trackData = [];
  trackEvents.forEach(ev => {
    const [delta, ...rest] = ev;
    varLen(delta).forEach(b => trackData.push(b));
    rest.forEach(b => trackData.push(b));
  });

  // MIDI header chunk
  const header = [
    0x4d, 0x54, 0x68, 0x64, // "MThd"
    0x00, 0x00, 0x00, 0x06, // chunk length = 6
    0x00, 0x00,             // format 0
    0x00, 0x01,             // 1 track
    (TICKS_PER_BEAT >> 8) & 0xff, TICKS_PER_BEAT & 0xff,
  ];

  // Track chunk
  const trackLen = trackData.length;
  const trackHeader = [
    0x4d, 0x54, 0x72, 0x6b, // "MTrk"
    (trackLen >> 24) & 0xff,
    (trackLen >> 16) & 0xff,
    (trackLen >> 8) & 0xff,
    trackLen & 0xff,
  ];

  const allBytes = [...header, ...trackHeader, ...trackData];
  return new Uint8Array(allBytes);
}

function exportMIDI() {
  if (!progression.length) return;
  const bytes = writeMidi(progression);
  const blob = new Blob([bytes], { type: 'audio/midi' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${currentKey}-${currentMode}.mid`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

// ── KEY SELECTOR ──
function buildKeySelector() {
  const sel = document.getElementById('keySelector');
  sel.innerHTML = '';
  NOTES.forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'key-btn' + (n === currentKey ? ' active' : '');
    btn.textContent = n;
    btn.onclick = () => { currentKey = n; buildKeySelector(); renderAll(); renderScaleBar(); };
    sel.appendChild(btn);
  });

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === currentMode);
    btn.onclick = () => {
      currentMode = btn.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
      renderScaleBar();
    };
  });
}

// ── SCALE BAR ──
function renderScaleBar() {
  const bar = document.getElementById('scaleBar');
  const rootIdx = NOTES.indexOf(currentKey);
  const intervals = currentMode === 'major' ? MAJOR_INTERVALS : MINOR_INTERVALS;
  const scaleNotes = intervals.map(i => NOTES[(rootIdx + i) % 12]);

  bar.innerHTML = `<span class="control-label">Scale</span><div class="scale-notes">${
    scaleNotes.map((n, i) => `<span class="scale-note${i === 0 ? ' root-note' : ''}">${NOTE_NAMES[n] || n}</span>`).join('')
  }</div>`;
}

// ── CHORD GRID ──
function renderAll() {
  const grid = document.getElementById('chordGrid');
  grid.innerHTML = '';
  const rootIdx = NOTES.indexOf(currentKey);
  const intervals = currentMode === 'major' ? MAJOR_INTERVALS : MINOR_INTERVALS;
  const qualities = currentMode === 'major' ? MAJOR_QUALITIES : MINOR_QUALITIES;
  const numerals  = currentMode === 'major' ? MAJOR_NUMERALS  : MINOR_NUMERALS;

  // ── Diatonic row ──
  const diatRow = buildRow('DIATONIC', intervals.map((interval, deg) => ({
    root: NOTES[(rootIdx + interval) % 12],
    quality: qualities[deg],
    numeral: numerals[deg],
    borrowed: false,
    secDom: null,
  })));
  grid.appendChild(diatRow);

  // ── Borrowed / modal interchange row ──
  const borrowedChords = BORROWED[currentMode].map(b => ({
    root: NOTES[(rootIdx + intervals[b.degree]) % 12],
    quality: b.quality,
    numeral: b.label,
    borrowed: true,
    source: b.source,
    secDom: null,
  }));
  const borrowedRow = buildRow('MODAL INTERCHANGE', borrowedChords);
  grid.appendChild(borrowedRow);

  // ── Secondary dominants row ──
  const secDoms = getSecondaryDominants(rootIdx, currentMode);
  const secDomRow = buildRow('SECONDARY DOMINANTS', secDoms.map(sd => ({
    root: NOTES[sd.root],
    quality: sd.quality,
    numeral: sd.label,
    borrowed: false,
    secDom: true,
    secDomLabel: sd.label,
  })));
  grid.appendChild(secDomRow);

  // ── Extensions row ──
  const extQualities = ['maj7','min7','dom7','sus2','sus4','add9','min7'];
  const extNumerals  = ['Imaj7','iim7','V7','Isus2','Isus4','Iadd9','vim7'];
  const extRow = buildRow('EXTENSIONS', intervals.slice(0,7).map((interval, deg) => ({
    root: NOTES[(rootIdx + interval) % 12],
    quality: extQualities[deg],
    numeral: extNumerals[deg],
    borrowed: false,
    secDom: null,
  })));
  grid.appendChild(extRow);
}

function buildRow(label, chords) {
  const section = document.createElement('div');
  section.className = 'section-head';
  section.innerHTML = `<span class="section-title">${label}</span>`;

  const row = document.createElement('div');
  row.className = 'chord-row';

  const rowLabel = document.createElement('div');
  rowLabel.className = 'row-label';
  rowLabel.textContent = '';
  row.appendChild(rowLabel);

  chords.forEach(ch => {
    const card = buildChordCard(ch);
    row.appendChild(card);
  });

  const wrap = document.createElement('div');
  wrap.appendChild(section);
  wrap.appendChild(row);
  return wrap;
}

function buildChordCard(ch) {
  const rootIdx = NOTES.indexOf(ch.root);
  const displayName = NOTE_NAMES[ch.root] || ch.root;

  const card = document.createElement('div');
  card.className = 'chord-card' + (ch.borrowed ? ' borrowed' : '');

  const numeral = document.createElement('div');
  numeral.className = 'chord-numeral';
  numeral.textContent = ch.numeral;

  const name = document.createElement('div');
  name.className = 'chord-name';
  name.textContent = displayName;

  const quality = document.createElement('div');
  quality.className = 'chord-quality';
  quality.textContent = ch.quality;

  card.appendChild(numeral);
  card.appendChild(name);
  card.appendChild(quality);

  if (ch.secDom) {
    const badge = document.createElement('span');
    badge.className = 'sec-dom-badge';
    badge.textContent = 'sec';
    card.appendChild(badge);
  }

  // Mini keyboard
  const kbWrap = document.createElement('div');
  kbWrap.className = 'keyboard-wrap';
  kbWrap.appendChild(buildKeyboard(rootIdx, ch.quality, 'mini'));
  card.appendChild(kbWrap);

  card.onclick = () => handleCardClick(ch, card);
  return card;
}

// ── KEYBOARD BUILDER ──
const WHITE_KEYS = [0,2,4,5,7,9,11]; // semitone offsets for C D E F G A B
const BLACK_OFFSETS = {1:0, 3:1, 6:3, 8:4, 10:5}; // semitone → white-key index

function buildKeyboard(rootIdx, quality, size = 'mini') {
  const kb = document.createElement('div');
  kb.className = 'keyboard';

  const numWhite = 8; // one octave + root
  const whiteW = 100 / numWhite;

  // Draw white keys
  WHITE_KEYS.forEach((semi, wi) => {
    const key = document.createElement('div');
    key.className = 'white-key';
    key.style.left = `${wi * whiteW}%`;
    key.style.width = `${whiteW - 0.8}%`;
    kb.appendChild(key);
  });

  // Draw extra root white key (octave above)
  const extraRoot = document.createElement('div');
  extraRoot.className = 'white-key';
  extraRoot.style.left = `${7 * whiteW}%`;
  extraRoot.style.width = `${whiteW - 0.8}%`;
  kb.appendChild(extraRoot);

  // Draw black keys
  [[1,1],[3,2],[6,4],[8,5],[10,6]].forEach(([semi, wi]) => {
    const key = document.createElement('div');
    key.className = 'black-key';
    key.style.left = `${wi * whiteW - whiteW * 0.3}%`;
    key.style.width = `${whiteW * 0.58}%`;
    kb.appendChild(key);
  });

  // Dots
  const intervals = CHORD_INTERVALS[quality] || [0,4,7];
  const scaleIntervals = currentMode === 'major' ? MAJOR_INTERVALS : MINOR_INTERVALS;
  const scaleSet = new Set(scaleIntervals.map(i => (rootIdx + i) % 12));

  // All 8 positions (0..7 semitones from root in the display octave, plus root at octave)
  for (let pos = 0; pos <= 12; pos++) {
    const semi = pos % 12;
    const isChordTone = intervals.includes(pos) || (pos === 12 && intervals.includes(0));
    const isRoot = (pos === 0 || pos === 12);
    const isScale = scaleSet.has((rootIdx + semi) % 12);
    if (!isChordTone && !isRoot && !isScale) continue;

    const isBlack = [1,3,6,8,10].includes(semi);
    let leftPct, bottomOffset;

    if (pos === 12) {
      // Octave root on the extra white key
      leftPct = 7 * whiteW + whiteW / 2;
      bottomOffset = null;
    } else if (!isBlack) {
      const wi = WHITE_KEYS.indexOf(semi);
      leftPct = wi * whiteW + whiteW / 2;
      bottomOffset = null;
    } else {
      // black key
      const blackWi = {1:1,3:2,6:4,8:5,10:6}[semi];
      leftPct = blackWi * whiteW - whiteW * 0.3 + (whiteW * 0.58) / 2;
      bottomOffset = 'black';
    }

    const dot = document.createElement('div');
    if (isRoot) {
      dot.className = 'key-dot root';
    } else if (isChordTone) {
      dot.className = 'key-dot chord-tone';
    } else {
      dot.className = 'key-dot scale-tone';
    }
    dot.style.left = `${leftPct}%`;
    dot.style.transform = 'translateX(-50%)';
    if (bottomOffset === 'black') {
      dot.style.bottom = '4px';
    }
    kb.appendChild(dot);
  }

  return kb;
}

// ── DETAIL PANEL ──
function handleCardClick(ch, cardEl) {
  // Add to progression on shift-click or direct click
  addToProgression(ch);

  // Toggle detail
  const panel = document.getElementById('detailPanel');
  if (activeDetailCard === cardEl && panel.classList.contains('visible')) {
    panel.classList.remove('visible');
    activeDetailCard = null;
    return;
  }

  activeDetailCard = cardEl;
  panel.classList.add('visible');

  const rootIdx = NOTES.indexOf(ch.root);
  const displayName = NOTE_NAMES[ch.root] || ch.root;
  const intervals = CHORD_INTERVALS[ch.quality] || [0,4,7];
  const noteNames = intervals.map(i => NOTE_NAMES[NOTES[(rootIdx + i) % 12]] || NOTES[(rootIdx + i) % 12]);

  const functions = {
    maj: 'Stable, resolved. Functions as tonic or subdominant.',
    min: 'Melancholic colour. Tonic, subdominant or pre-dominant.',
    dim: 'Tense, unstable. Leading-tone chord resolving inward.',
    dom7: 'Strong pull toward tonic. Classic V–I resolution.',
    maj7: 'Warm, sophisticated. Major with added major 7th.',
    min7: 'Smooth, jazzy. Minor with added minor 7th.',
    sus2: 'Open, ambiguous. Suspended 2nd instead of 3rd.',
    sus4: 'Anticipatory tension. Suspended 4th resolving to 3rd.',
    add9: 'Lush. Major triad with added 9th (no 7th).',
  };

  document.getElementById('detailInner').innerHTML = `
    <div class="detail-col">
      <div class="detail-label">Chord</div>
      <div class="detail-chord-name">${displayName} <span style="font-size:20px;color:var(--muted)">${ch.quality}</span></div>
      <div class="detail-notes">${noteNames.join(' · ')}</div>
      <div class="detail-function">${functions[ch.quality] || ''}</div>
      ${ch.source ? `<div class="detail-function" style="margin-top:4px;color:var(--accent2)">Source: ${ch.source}</div>` : ''}
    </div>
    <div class="detail-col detail-keyboard">
      <div class="detail-label">Voicing</div>
      ${buildDetailKeyboard(rootIdx, ch.quality)}
    </div>
    <div class="detail-col">
      <div class="detail-label">Numeral</div>
      <div style="font-family:'Space Mono',monospace;font-size:24px;color:var(--accent);margin-bottom:12px">${ch.numeral}</div>
      <div class="detail-label" style="margin-top:8px">Quick play</div>
      <div class="voicing-strip" id="detailVoicingStrip"></div>
    </div>
  `;

  // Voicing buttons
  const strip = document.getElementById('detailVoicingStrip');
  ['close','open','inv1','inv2','drop2'].forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'v-btn';
    btn.textContent = v;
    btn.onclick = () => {
      strip.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const rootNote = NOTES.indexOf(ch.root);
      const rootMidi = 48 + rootNote;
      const ctx = getAudioCtx();
      playChord(rootMidi, ch.quality, v, ctx.currentTime + 0.02, 2, ctx);
    };
    strip.appendChild(btn);
  });
}

function buildDetailKeyboard(rootIdx, quality) {
  const wrap = document.createElement('div');
  wrap.className = 'detail-keyboard';
  wrap.appendChild(buildKeyboard(rootIdx, quality, 'detail'));
  const tmp = document.createElement('div');
  tmp.appendChild(wrap);
  return tmp.innerHTML;
}

// ── PROGRESSION ──
const MAX_SLOTS = 8;

function initProgression() {
  const slots = document.getElementById('progSlots');
  slots.innerHTML = '';
  for (let i = 0; i < MAX_SLOTS; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'prog-slot-wrap';
    wrap.id = `slot-wrap-${i}`;

    const slot = document.createElement('div');
    slot.className = 'prog-slot';
    slot.id = `slot-${i}`;
    slot.textContent = '—';

    const removeBtn = document.createElement('span');
    removeBtn.className = 'slot-remove';
    removeBtn.textContent = '✕';
    removeBtn.onclick = (e) => { e.stopPropagation(); removeFromProgression(i); };
    slot.appendChild(removeBtn);

    // Voicing sub-buttons (always in DOM)
    const voicingRow = document.createElement('div');
    voicingRow.className = 'slot-voicing';

    ['close','open','inv1','drop2'].forEach(v => {
      const vb = document.createElement('button');
      vb.className = 'slot-v-btn';
      vb.dataset.voicing = v;
      vb.textContent = v;
      vb.onclick = (e) => {
        e.stopPropagation();
        if (progression[i]) {
          progression[i].voicing = v;
          voicingRow.querySelectorAll('.slot-v-btn').forEach(b => b.classList.remove('active'));
          vb.classList.add('active');
        }
      };
      voicingRow.appendChild(vb);
    });

    wrap.appendChild(slot);
    wrap.appendChild(voicingRow);
    slots.appendChild(wrap);
  }
}

function addToProgression(ch) {
  if (progression.length >= MAX_SLOTS) return;
  progression.push({ root: ch.root, quality: ch.quality, name: ch.root, voicing: 'close' });
  updateProgressionUI();
}

function removeFromProgression(idx) {
  progression.splice(idx, 1);
  updateProgressionUI();
}

function clearProgression() {
  progression = [];
  updateProgressionUI();
}

function updateProgressionUI() {
  for (let i = 0; i < MAX_SLOTS; i++) {
    const slot = document.getElementById(`slot-${i}`);
    const wrap = document.getElementById(`slot-wrap-${i}`);
    const voicingRow = wrap.querySelector('.slot-voicing');
    const ch = progression[i];

    if (ch) {
      slot.childNodes[0].textContent = ch.root;
      slot.title = ch.quality;
      slot.classList.add('filled');
      wrap.classList.add('filled');
      // Set active voicing button
      voicingRow.querySelectorAll('.slot-v-btn').forEach(vb => {
        vb.classList.toggle('active', vb.dataset.voicing === (ch.voicing || 'close'));
      });
    } else {
      slot.childNodes[0].textContent = '—';
      slot.title = '';
      slot.classList.remove('filled');
      wrap.classList.remove('filled');
    }
  }
}

// ── SAVED PROGRESSIONS ──
function saveProgression() {
  if (!progression.length) return;
  const name = `Prog ${savedProgressions.length + 1}`;
  savedProgressions.push({
    name,
    key: currentKey,
    mode: currentMode,
    chords: JSON.parse(JSON.stringify(progression)),
  });
  localStorage.setItem('chord-progressions', JSON.stringify(savedProgressions));
  renderSaved();
}

function renderSaved() {
  const list = document.getElementById('savedList');
  if (!savedProgressions.length) {
    list.innerHTML = '<div class="empty-saved">No saved progressions yet. Build one above and hit Save.</div>';
    return;
  }
  list.innerHTML = '';
  savedProgressions.forEach((prog, idx) => {
    const item = document.createElement('div');
    item.className = 'saved-item';
    item.innerHTML = `
      <span class="saved-name">${prog.name}</span>
      <span class="saved-chords">${prog.chords.map(c => c.root).join(' · ')}</span>
      <span class="saved-key">${prog.key} ${prog.mode}</span>
      <button class="saved-del" title="Delete">✕</button>
    `;
    item.onclick = () => loadProgression(idx);
    item.querySelector('.saved-del').onclick = (e) => { e.stopPropagation(); deleteProgression(idx); };
    list.appendChild(item);
  });
}

function loadProgression(idx) {
  const prog = savedProgressions[idx];
  currentKey = prog.key;
  currentMode = prog.mode;
  progression = JSON.parse(JSON.stringify(prog.chords));
  buildKeySelector();
  renderAll();
  renderScaleBar();
  initProgression();
  updateProgressionUI();
}

function deleteProgression(idx) {
  savedProgressions.splice(idx, 1);
  localStorage.setItem('chord-progressions', JSON.stringify(savedProgressions));
  renderSaved();
}

// ── MIDI EXPORT INIT ──
function initMIDI() {
  // Nothing to init — exportMIDI() is wired to the button directly
  // This function exists so renderSaved() can call it without error
}

// ── INIT ──
buildKeySelector();
renderAll();
renderScaleBar();
initProgression();
renderSaved();
initMIDI();
</script>
